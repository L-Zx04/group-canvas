<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f6">
  <title>群聊共创页</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar"><span class="mark" aria-hidden="true">✳</span><span>群聊共创页</span><span class="topbar-end">公开页面</span></header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div class="intro-art" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p class="eyebrow">GROUP CANVAS</p>
      <h1 id="page-title">群聊共创页</h1>
      <p id="subtitle">来自群聊的公开更新</p>
      <div class="intro-meta"><span class="status-dot"></span><span id="updated">等待首次更新</span></div>
    </section>
    <section class="updates" aria-labelledby="updates-title">
      <div class="section-head"><h2 id="updates-title">最新内容</h2><span id="count">0 条</span></div>
      <div id="items" class="item-list"><p class="empty">还没有内容</p></div>
    </section>
  </main>
  <footer>由群聊共同维护</footer>
</body>
</html>
