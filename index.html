<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1d2a">
  <title>鹈鹕骑行大队 · 2D 动画</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <svg class="scene" viewBox="0 0 1200 900" role="img" aria-label="鹈鹕骑着自行车在孙悟空驾驶的大型飞机机翼上，展开的翅膀托着北极熊，秦始皇骑在熊上拧螺丝">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8fd3f4"/>
          <stop offset=".55" stop-color="#dff3fd"/>
          <stop offset="1" stop-color="#fdf6e3"/>
        </linearGradient>
        <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fbfdff"/>
          <stop offset=".5" stop-color="#d3e0ea"/>
          <stop offset="1" stop-color="#9db2c2"/>
        </linearGradient>
        <linearGradient id="wingG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eef7fc"/>
          <stop offset="1" stop-color="#a6bccb"/>
        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#cdefff" stop-opacity=".95"/>
          <stop offset="1" stop-color="#7fc4e8" stop-opacity=".9"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#fff6c9" stop-opacity=".95"/>
          <stop offset="1" stop-color="#fff6c9" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="birdBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#dfe9f1"/>
        </linearGradient>
        <linearGradient id="bearG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#dfe9ef"/>
        </linearGradient>
        <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2f3440"/>
          <stop offset="1" stop-color="#111319"/>
        </linearGradient>
      </defs>

      <!-- 天空 -->
      <rect width="1200" height="900" fill="url(#sky)"/>
      <circle class="sun-glow" cx="1040" cy="132" r="150" fill="url(#sunGlow)"/>
      <circle cx="1040" cy="132" r="58" fill="#ffe98a"/>
      <circle cx="1040" cy="132" r="58" fill="none" stroke="#ffd85e" stroke-width="3" opacity=".6"/>

      <!-- 云 -->
      <g class="cloud c1" fill="#ffffff" opacity=".9">
        <ellipse cx="180" cy="190" rx="88" ry="36"/>
        <ellipse cx="250" cy="168" rx="60" ry="34"/>
        <ellipse cx="120" cy="176" rx="52" ry="26"/>
      </g>
      <g class="cloud c2" fill="#ffffff" opacity=".75">
        <ellipse cx="620" cy="120" rx="100" ry="34"/>
        <ellipse cx="700" cy="104" rx="62" ry="28"/>
        <ellipse cx="556" cy="110" rx="48" ry="22"/>
      </g>
      <g class="cloud c3" fill="#ffffff" opacity=".65">
        <ellipse cx="980" cy="300" rx="76" ry="28"/>
        <ellipse cx="1030" cy="286" rx="48" ry="22"/>
        <ellipse cx="934" cy="292" rx="36" ry="18"/>
      </g>

      <!-- 飞机（孙悟空驾驶） -->
      <g class="plane">
        <!-- 尾翼 -->
        <path d="M760 640 L846 494 L902 500 L890 646 Z" fill="url(#metal)"/>
        <path d="M760 640 L846 494 L870 496 L806 646 Z" fill="#c2d2de" opacity=".55"/>
        <!-- 机身 -->
        <rect x="160" y="612" width="740" height="166" rx="83" fill="url(#metal)"/>
        <circle cx="160" cy="695" r="83" fill="url(#metal)"/>
        <!-- 机身暗部 -->
        <path d="M212 758 q320 26 640 2 l-26 20 q-300 22 -588 -2 Z" fill="#a9bccb" opacity=".75"/>
        <!-- 舷窗线 -->
        <line x1="500" y1="690" x2="860" y2="690" stroke="#8ea7b8" stroke-width="10" opacity=".45" stroke-linecap="round"/>
        <!-- 座舱玻璃 -->
        <rect x="250" y="648" width="232" height="96" rx="48" fill="url(#glass)" stroke="#6f97b4" stroke-width="4"/>
        <!-- 孙悟空 -->
        <g class="wukong">
          <ellipse cx="366" cy="722" rx="50" ry="40" fill="#c9884f"/>
          <circle cx="366" cy="686" r="34" fill="#dc9a5e"/>
          <circle cx="366" cy="700" rx="20" ry="16" fill="#f3c89b"/>
          <circle cx="353" cy="682" r="4.5" fill="#2b1c12"/>
          <circle cx="379" cy="682" r="4.5" fill="#2b1c12"/>
          <path d="M353 703 q13 11 26 0" stroke="#2b1c12" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="333" cy="690" r="9" fill="#c98550"/>
          <circle cx="399" cy="690" r="9" fill="#c98550"/>
          <path d="M332 668 q34 -18 68 0" stroke="#f2c14e" stroke-width="8" fill="none" stroke-linecap="round"/>
          <circle cx="332" cy="668" r="7" fill="#f2c14e"/>
          <circle cx="400" cy="668" r="7" fill="#f2c14e"/>
        </g>
        <!-- 螺旋桨 -->
        <g transform="translate(78,695)">
          <g class="prop">
            <ellipse rx="94" ry="13" fill="#a8bcca" opacity=".95"/>
            <ellipse rx="13" ry="94" fill="#a8bcca" opacity=".95"/>
            <circle r="17" fill="#6d8291"/>
            <circle r="8" fill="#8fa4b2"/>
          </g>
        </g>
        <!-- 机翼 -->
        <path d="M600 758 L1150 772 L1152 862 L582 846 Z" fill="url(#wingG)" stroke="#8ba0b0" stroke-width="3"/>
        <line x1="660" y1="796" x2="1146" y2="812" stroke="#9db2c2" stroke-width="2" opacity=".7"/>
        <line x1="640" y1="820" x2="1148" y2="836" stroke="#9db2c2" stroke-width="2" opacity=".55"/>
      </g>

      <!-- 自行车 -->
      <g class="bike">
        <g class="wheel" transform="translate(720,716)">
          <circle r="44" fill="none" stroke="#33414d" stroke-width="7"/>
          <circle r="9" fill="#33414d"/>
          <line x1="-36" y1="0" x2="36" y2="0" stroke="#607684" stroke-width="3"/>
          <line x1="0" y1="-36" x2="0" y2="36" stroke="#607684" stroke-width="3"/>
          <line x1="-25" y1="-25" x2="25" y2="25" stroke="#607684" stroke-width="3"/>
          <line x1="-25" y1="25" x2="25" y2="-25" stroke="#607684" stroke-width="3"/>
        </g>
        <g class="wheel" transform="translate(900,716)">
          <circle r="44" fill="none" stroke="#33414d" stroke-width="7"/>
          <circle r="9" fill="#33414d"/>
          <line x1="-36" y1="0" x2="36" y2="0" stroke="#607684" stroke-width="3"/>
          <line x1="0" y1="-36" x2="0" y2="36" stroke="#607684" stroke-width="3"/>
          <line x1="-25" y1="-25" x2="25" y2="25" stroke="#607684" stroke-width="3"/>
          <line x1="-25" y1="25" x2="25" y2="-25" stroke="#607684" stroke-width="3"/>
        </g>
        <g stroke="#2f3a44" stroke-width="8" stroke-linecap="round" fill="none">
          <line x1="720" y1="716" x2="792" y2="648"/>
          <line x1="720" y1="716" x2="812" y2="716"/>
          <line x1="792" y1="648" x2="812" y2="716"/>
          <line x1="812" y1="716" x2="900" y2="716"/>
          <line x1="812" y1="716" x2="880" y2="640"/>
          <line x1="792" y1="648" x2="880" y2="640"/>
        </g>
        <path d="M868 626 q30 -8 34 8" stroke="#2f3a44" stroke-width="7" fill="none" stroke-linecap="round"/>
        <circle cx="812" cy="716" r="9" fill="#4a5b68"/>

        <!-- 鹈鹕 -->
        <path d="M852 606 l46 -16 l-10 34 Z" fill="#dfe9f2" stroke="#c3d3de" stroke-width="2"/>
        <ellipse cx="800" cy="612" rx="60" ry="46" fill="url(#birdBody)" stroke="#c6d4de" stroke-width="3"/>
        <path d="M762 600 C738 578 736 556 748 540" fill="none" stroke="#f4fafd" stroke-width="26" stroke-linecap="round"/>
        <circle cx="742" cy="536" r="28" fill="#f8fcfe" stroke="#c6d4de" stroke-width="3"/>
        <path d="M718 530 q-54 6 -88 28 q32 26 88 12 Z" fill="#f4a53f" stroke="#d98a28" stroke-width="2.5"/>
        <line x1="712" y1="534" x2="640" y2="556" stroke="#d98a28" stroke-width="2" opacity=".7"/>
        <circle cx="736" cy="528" r="5.5" fill="#1e2a33"/>
        <circle cx="738" cy="526" r="1.8" fill="#ffffff"/>

        <!-- 托着平台的翅膀 -->
        <path class="wing-l" d="M772 588 C740 560 726 508 744 476 C764 500 780 542 790 584 Z" fill="#eef7fc" stroke="#c3d3de" stroke-width="3"/>
        <path class="wing-r" d="M828 588 C860 560 874 508 856 476 C836 500 820 542 810 584 Z" fill="#eef7fc" stroke="#c3d3de" stroke-width="3"/>

        <!-- 踏板上的鹈鹕腿 -->
        <g class="leg back">
          <polyline points="810,650 818,690 816,712" fill="none" stroke="#e0912f" stroke-width="10" stroke-linecap="round"/>
        </g>
        <g class="leg front">
          <polyline points="788,650 800,692 810,712" fill="none" stroke="#f4a53f" stroke-width="10" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 木板平台 -->
      <rect x="736" y="470" width="178" height="14" rx="7" fill="#c9a06a" stroke="#a9803f" stroke-width="2.5"/>
      <rect x="736" y="470" width="178" height="5" rx="2.5" fill="#e0bd8c" opacity=".8"/>

      <!-- 北极熊 -->
      <g class="bear">
        <rect x="790" y="424" width="19" height="42" rx="9" fill="#f2f8fb" stroke="#cfdde6" stroke-width="2.5"/>
        <rect x="814" y="430" width="19" height="36" rx="9" fill="#e6eff5" stroke="#cfdde6" stroke-width="2.5"/>
        <rect x="846" y="430" width="19" height="36" rx="9" fill="#e6eff5" stroke="#cfdde6" stroke-width="2.5"/>
        <rect x="866" y="424" width="19" height="42" rx="9" fill="#f2f8fb" stroke="#cfdde6" stroke-width="2.5"/>
        <ellipse cx="828" cy="402" rx="54" ry="40" fill="url(#bearG)" stroke="#cfdde6" stroke-width="3"/>
        <circle cx="862" cy="340" r="10" fill="#f8fcfe" stroke="#cfdde6" stroke-width="2.5"/>
        <circle cx="900" cy="340" r="10" fill="#f8fcfe" stroke="#cfdde6" stroke-width="2.5"/>
        <circle cx="882" cy="362" r="29" fill="#f8fcfe" stroke="#cfdde6" stroke-width="3"/>
        <ellipse cx="900" cy="372" rx="14" ry="11" fill="#e8f0f5"/>
        <circle cx="906" cy="368" r="4.5" fill="#2b3a45"/>
        <circle cx="873" cy="356" r="4" fill="#2b3a45"/>
        <circle cx="892" cy="356" r="4" fill="#2b3a45"/>
      </g>

      <!-- 秦始皇：打螺丝 -->
      <g class="qin">
        <ellipse cx="796" cy="330" rx="27" ry="31" fill="url(#robe)" stroke="#b8342c" stroke-width="3"/>
        <path d="M776 316 q20 12 40 0" fill="none" stroke="#d8443c" stroke-width="3"/>
        <circle cx="796" cy="292" r="24" fill="#f1c9a3" stroke="#d8b08c" stroke-width="2"/>
        <path d="M786 310 q10 8 20 0" fill="none" stroke="#8c6a4d" stroke-width="3" stroke-linecap="round"/>
        <circle cx="788" cy="290" r="3.2" fill="#2b2b2b"/>
        <circle cx="804" cy="290" r="3.2" fill="#2b2b2b"/>
        <rect x="760" y="252" width="72" height="10" rx="3" fill="#14161c"/>
        <rect x="782" y="244" width="28" height="10" rx="3" fill="#262a33"/>
        <line x1="772" y1="262" x2="772" y2="276" stroke="#c9a227" stroke-width="2"/>
        <line x1="796" y1="262" x2="796" y2="280" stroke="#c9a227" stroke-width="2"/>
        <line x1="820" y1="262" x2="820" y2="276" stroke="#c9a227" stroke-width="2"/>
        <circle cx="772" cy="277" r="3.4" fill="#f2c14e"/>
        <circle cx="796" cy="281" r="3.4" fill="#f2c14e"/>
        <circle cx="820" cy="277" r="3.4" fill="#f2c14e"/>

        <!-- 拿螺丝刀的手臂 -->
        <g class="arm">
          <line x1="816" y1="322" x2="852" y2="334" stroke="#1b1d24" stroke-width="9" stroke-linecap="round"/>
          <circle cx="854" cy="335" r="7.5" fill="#f1c9a3"/>
          <line x1="858" y1="338" x2="874" y2="350" stroke="#8f9aa6" stroke-width="6" stroke-linecap="round"/>
          <path d="M876 352 l6 -3 l3 6 l-6 3 Z" fill="#c9d6e0"/>
        </g>

        <!-- 螺丝板 -->
        <rect x="856" y="344" width="44" height="28" rx="5" fill="#9fb3c2" stroke="#6d8291" stroke-width="2.5"/>
        <circle cx="866" cy="352" r="4" fill="#e6eff5" stroke="#5f727f" stroke-width="2"/>
        <circle cx="890" cy="352" r="4" fill="#e6eff5" stroke="#5f727f" stroke-width="2"/>
        <circle cx="878" cy="362" r="4" fill="#e6eff5" stroke="#5f727f" stroke-width="2"/>

        <!-- 火花 -->
        <g class="spark" stroke="#ffcf4d" stroke-width="2.5" stroke-linecap="round">
          <line x1="878" y1="344" x2="882" y2="336"/>
          <line x1="884" y1="346" x2="892" y2="342"/>
          <line x1="874" y1="342" x2="872" y2="334"/>
        </g>
        <g class="spark s2" stroke="#ff9a3d" stroke-width="2" stroke-linecap="round">
          <line x1="884" y1="368" x2="892" y2="374"/>
          <line x1="872" y1="370" x2="866" y2="378"/>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
