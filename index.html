<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08141f">
  <title>鹈鹕骑自行车 · 2D 动画</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <svg class="scene" viewBox="0 0 1200 700" role="img" aria-label="一只鹈鹕骑着自行车前进的二维动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7fc9ef"/>
          <stop offset=".6" stop-color="#dff1fb"/>
          <stop offset="1" stop-color="#fff4d9"/>
        </linearGradient>
        <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#dfe9f1"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7d8f7e"/>
          <stop offset="1" stop-color="#5a6b5c"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/>
          <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- 天空 -->
      <rect width="1200" height="700" fill="url(#sky)"/>
      <circle class="sun" cx="1000" cy="130" r="140" fill="url(#sunGlow)"/>
      <circle cx="1000" cy="130" r="58" fill="#ffe98a"/>

      <!-- 云 -->
      <g class="cloud c1" fill="#ffffff" opacity=".92">
        <ellipse cx="170" cy="150" rx="86" ry="34"/>
        <ellipse cx="238" cy="130" rx="58" ry="30"/>
        <ellipse cx="112" cy="138" rx="48" ry="24"/>
      </g>
      <g class="cloud c2" fill="#ffffff" opacity=".78">
        <ellipse cx="600" cy="96" rx="96" ry="30"/>
        <ellipse cx="676" cy="82" rx="58" ry="24"/>
        <ellipse cx="540" cy="88" rx="44" ry="20"/>
      </g>
      <g class="cloud c3" fill="#ffffff" opacity=".62">
        <ellipse cx="880" cy="290" rx="72" ry="26"/>
        <ellipse cx="930" cy="278" rx="46" ry="20"/>
        <ellipse cx="836" cy="284" rx="34" ry="16"/>
      </g>

      <!-- 远山 -->
      <path d="M0 470 L150 380 L280 470 Z" fill="#9db9a6" opacity=".55"/>
      <path d="M230 470 L400 360 L560 470 Z" fill="#8aa894" opacity=".5"/>
      <path d="M0 470 h1200 v40 H0 Z" fill="#a8c0ab" opacity=".35"/>

      <!-- 路面 -->
      <rect x="0" y="560" width="1200" height="140" fill="url(#road)"/>
      <rect x="0" y="556" width="1200" height="10" fill="#8fa78f"/>
      <g class="dash" stroke="#f2f5e9" stroke-width="9" stroke-linecap="round" opacity=".85">
        <line x1="40" y1="640" x2="110" y2="640"/>
        <line x1="200" y1="640" x2="270" y2="640"/>
        <line x1="360" y1="640" x2="430" y2="640"/>
        <line x1="520" y1="640" x2="590" y2="640"/>
        <line x1="680" y1="640" x2="750" y2="640"/>
        <line x1="840" y1="640" x2="910" y2="640"/>
        <line x1="1000" y1="640" x2="1070" y2="640"/>
        <line x1="1160" y1="640" x2="1230" y2="640"/>
      </g>

      <!-- 速度线 -->
      <g class="speed" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".8">
        <line x1="380" y1="330" x2="470" y2="330"/>
        <line x1="360" y1="380" x2="465" y2="380"/>
        <line x1="400" y1="430" x2="480" y2="430"/>
      </g>

      <!-- 自行车 -->
      <g class="bike">
        <!-- 后轮 -->
        <g class="wheel" transform="translate(560,520)">
          <circle r="72" fill="none" stroke="#2c3a45" stroke-width="10"/>
          <circle r="72" fill="none" stroke="#5f7583" stroke-width="3"/>
          <circle r="12" fill="#2c3a45"/>
          <g stroke="#6c8494" stroke-width="4">
            <line x1="-60" y1="0" x2="60" y2="0"/>
            <line x1="0" y1="-60" x2="0" y2="60"/>
            <line x1="-42" y1="-42" x2="42" y2="42"/>
            <line x1="-42" y1="42" x2="42" y2="-42"/>
          </g>
        </g>
        <!-- 前轮 -->
        <g class="wheel" transform="translate(830,520)">
          <circle r="72" fill="none" stroke="#2c3a45" stroke-width="10"/>
          <circle r="72" fill="none" stroke="#5f7583" stroke-width="3"/>
          <circle r="12" fill="#2c3a45"/>
          <g stroke="#6c8494" stroke-width="4">
            <line x1="-60" y1="0" x2="60" y2="0"/>
            <line x1="0" y1="-60" x2="0" y2="60"/>
            <line x1="-42" y1="-42" x2="42" y2="42"/>
            <line x1="-42" y1="42" x2="42" y2="-42"/>
          </g>
        </g>

        <!-- 车架 -->
        <g stroke="#2c3a45" stroke-width="12" stroke-linecap="round" fill="none">
          <line x1="560" y1="520" x2="662" y2="412"/>
          <line x1="560" y1="520" x2="700" y2="520"/>
          <line x1="662" y1="412" x2="700" y2="520"/>
          <line x1="700" y1="520" x2="830" y2="520"/>
          <line x1="700" y1="520" x2="806" y2="392"/>
          <line x1="662" y1="412" x2="806" y2="392"/>
        </g>
        <!-- 车把 -->
        <path d="M792 378 q34 -10 40 12" stroke="#2c3a45" stroke-width="10" fill="none" stroke-linecap="round"/>
        <!-- 坐垫 -->
        <path d="M644 400 q34 -6 40 12" stroke="#7a4b34" stroke-width="12" fill="none" stroke-linecap="round"/>

        <!-- 鹈鹕身体 -->
        <g class="body-bob">
          <!-- 尾羽 -->
          <path d="M690 392 l58 -18 l-12 44 Z" fill="#dfe9f2" stroke="#c3d3de" stroke-width="3"/>
          <!-- 身体 -->
          <ellipse cx="630" cy="392" rx="74" ry="56" fill="url(#feather)" stroke="#c6d4de" stroke-width="4"/>
          <!-- 脖子 -->
          <path d="M584 372 C556 344 552 316 566 296" fill="none" stroke="#f7fcff" stroke-width="34" stroke-linecap="round"/>
          <!-- 头 -->
          <circle cx="562" cy="288" r="36" fill="#fbfeff" stroke="#c6d4de" stroke-width="4"/>
          <!-- 喙 -->
          <path d="M532 280 q-72 8 -116 36 q42 34 116 14 Z" fill="#f5a93f" stroke="#d98a28" stroke-width="3"/>
          <path d="M532 282 q-64 10 -108 34" fill="none" stroke="#d98a28" stroke-width="3" opacity=".75"/>
          <!-- 眼睛 -->
          <circle cx="556" cy="278" r="7.5" fill="#1e2a33"/>
          <circle cx="559" cy="275" r="2.6" fill="#ffffff"/>
          <!-- 翅膀 -->
          <path class="wing" d="M604 366 C566 322 542 258 566 214 C596 244 622 300 640 356 Z" fill="#eef7fc" stroke="#c3d3de" stroke-width="4"/>
          <path d="M604 372 C582 340 566 300 570 262" fill="none" stroke="#cfdde7" stroke-width="3" opacity=".9"/>
        </g>

        <!-- 腿 -->
        <g class="leg back">
          <polyline points="646,440 668,478 690,516" fill="none" stroke="#e0912f" stroke-width="13" stroke-linecap="round"/>
        </g>
        <g class="leg front">
          <polyline points="612,442 642,482 672,518" fill="none" stroke="#f5a93f" stroke-width="13" stroke-linecap="round"/>
        </g>
        <!-- 曲柄 -->
        <circle cx="700" cy="520" r="13" fill="#4a5b68"/>
        <g class="wheel" transform="translate(700,520)">
          <line x1="-26" y1="-10" x2="26" y2="10" stroke="#4a5b68" stroke-width="8" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 前景草 -->
      <g fill="#6d8a70" opacity=".7">
        <ellipse cx="120" cy="690" rx="90" ry="26"/>
        <ellipse cx="420" cy="700" rx="110" ry="24"/>
        <ellipse cx="880" cy="696" rx="120" ry="28"/>
      </g>
    </svg>
  </div>
</body>
</html>
