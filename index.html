<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131f">
  <title>群聊共创页</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <header class="topbar">
    <span class="mark" aria-hidden="true">◆</span>
    <span class="brand">群聊共创页</span>
    <span class="topbar-end">公开页面</span>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div class="intro-art" aria-hidden="true">
        <svg viewBox="0 0 240 170" fill="none">
          <path d="M28 96c0-30 26-52 60-52 33 0 58 20 62 47h24l-20 19 20 19h-24c-4 27-29 47-62 47-34 0-60-22-60-52" stroke="rgba(120,220,255,.55)" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="74" cy="86" r="5" fill="rgba(150,235,255,.75)"/>
          <path d="M52 150c14 8 30 12 48 12" stroke="rgba(120,220,255,.3)" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="186" cy="60" r="3" fill="rgba(150,235,255,.5)"/>
          <circle cx="205" cy="86" r="2" fill="rgba(150,235,255,.35)"/>
          <circle cx="38" cy="52" r="2" fill="rgba(150,235,255,.35)"/>
        </svg>
      </div>
      <p class="eyebrow">GROUP CANVAS</p>
      <h1 id="page-title">群聊共创页</h1>
      <p id="subtitle">来自群聊的公开更新</p>
      <div class="intro-meta"><span class="status-dot"></span><span id="updated">等待首次更新</span></div>
    </section>
    <section class="updates" aria-labelledby="updates-title">
      <div class="section-head"><h2 id="updates-title">最新内容</h2><span id="count">0 条</span></div>
      <div id="items" class="item-list"><p class="empty">还没有内容</p></div>
    </section>
  </main>
  <footer>由群聊共同维护 · StardustRain</footer>
</body>
</html>
